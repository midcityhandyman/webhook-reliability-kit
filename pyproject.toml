[project]
name = "webhook-reliability-kit"
version = "0.1.0"
description = "Idempotency keys, a SQLite outbox with backoff and dead letters, signature verification, and replay."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["webhook_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
